<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إرسال بيانات إلى الخادم</title>
</head>
<body>
    <h2>نموذج التواصل</h2>
    <button onclick="sendData()">إرسال التنبيه</button>

    <script>
        function sendData() {
            // إرسال طلب إلى الخادم الخلفي المحمر
            fetch('http://localhost:5000/api/send-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    content: "تم النقر على الزر من قبل المستخدم."
                })
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === "success") {
                    alert("تمت العملية بنجاح!");
                } else {
                    alert("حدث خطأ: " + result.message);
                }
            })
            .catch(error => console.error("Error:", error));
        }
    </script>
</body>
</html>
